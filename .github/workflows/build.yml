name: build

on:
  push:
    paths-ignore: ['docs/**', '*.md', '**/*.png']
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the "test-latest" prerelease with the APK

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Tools for fixtures and oracles (mkfs.fat, mtools, fsck.fat, exfatprogs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dosfstools mtools exfatprogs
          pip install cryptography
      - name: Generate fixtures
        run: |
          python3 tools/make_fixtures.py
          python3 tools/make_exfat.py
      - name: JVM tests (Maven)
        run: mvn -B -q test

  apk:
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Build APK
        run: gradle --no-daemon :apk:assembleRelease
      - name: Verify APK
        run: |
          APK=apk/build/outputs/apk/release/apk-release.apk
          BT="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/35.0.0)"
          "$BT/apksigner" verify --verbose "$APK" | head -6
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdk|uses-permission" || true
          cp "$APK" openvault-test.apk
          sha256sum openvault-test.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: openvault-test-apk
          path: |
            openvault-test.apk
            SHA256SUMS.txt

  windows:
    runs-on: windows-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build fat jar
        shell: bash
        run: mvn -B -q -pl desktop -am package -DskipTests
      - name: Package self-contained app with jpackage (bundles Java; no installer, no admin rights)
        shell: bash
        run: |
          mkdir -p dist out
          cp desktop/target/openvault-desktop.jar dist/
          printf 'win-console=true\n' > console.properties
          jpackage --type app-image --name OpenVault --app-version 0.1.1 --input dist \
            --main-jar openvault-desktop.jar --main-class org.openvault.desktop.AppKt \
            --add-modules java.base,java.desktop,java.logging,java.prefs \
            --java-options "-Xmx1g" --add-launcher OpenVault-console=console.properties --dest out
          ls -la out/OpenVault
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path out/OpenVault -DestinationPath OpenVault-windows.zip
          (Get-FileHash OpenVault-windows.zip -Algorithm SHA256).Hash.ToLower() + "  OpenVault-windows.zip" | Out-File -Encoding ascii SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: openvault-windows
          path: |
            OpenVault-windows.zip
            SHA256SUMS-windows.txt

  publish:
    runs-on: ubuntu-latest
    needs: [apk, windows]
    if: github.ref_type == 'branch'
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Publish public test build (prerelease "test-latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release delete test-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create test-latest artifacts/* --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Latest test build" \
            --notes "Debug-signed test builds of branch ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}): Android APK + Windows desktop app (unzip, run OpenVault.exe). Not for production use."
